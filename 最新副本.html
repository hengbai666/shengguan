<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>升官模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg-page:#f4ece0;--beam-bg:#d2be9c;--beam-border:#b8a280;--card-bg:#fbf5e8;
  --card-border:#c8b492;--card-radius:14px;--card-padding-y:20px;--card-padding-x:18px;
  --opt-bg:#fffaf0;--opt-border:#d9c7aa;--opt-radius:10px;--cinnabar:#b9412c;
  --ink-main:#3a2b1a;--ink-soft:#6b5842;--line-height-base:1.65;
}
body{font-family:"KaiTi","STKaiti","SimSun",serif;background-color:var(--bg-page);
  color:var(--ink-main);line-height:var(--line-height-base);min-height:100vh;
  overflow-x:hidden;padding-bottom:70px;font-size:15px;}
.top-beam{position:fixed;top:0;left:0;right:0;height:52px;background-color:var(--beam-bg);
  border-bottom:1px solid var(--beam-border);z-index:10;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px;}
.help-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--cinnabar);
  background:var(--card-bg);color:var(--cinnabar);font-size:18px;z-index:11;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-weight:bold;}
.help-btn:hover{background:var(--cinnabar);color:#fff;}
.status-box{display:none;flex-direction:row;gap:20px;font-size:14px;}
.status-item{display:flex;gap:6px;}
.status-lab{color:var(--ink-soft);letter-spacing:1px;}
.status-val{color:var(--cinnabar);font-weight:500;}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;height:60px;background:var(--beam-bg);
  border-top:1px solid var(--beam-border);z-index:20;display:flex;align-items:center;
  justify-content:center;gap:16px;padding:0 12px;}
.bottom-btn{min-width:90px;padding:7px 10px;background:var(--opt-bg);
  border:1px solid var(--opt-border);border-radius:var(--opt-radius);font-family:inherit;
  font-size:14px;cursor:pointer;color:var(--ink-main);text-align:center;}
.bottom-btn:hover{border-color:var(--cinnabar);}
.bottom-btn.disabled-save{background:#e2ddcf;color:#999;border-color:#d1c8b4;cursor:not-allowed;}
.bottom-btn.disabled-save:hover{border-color:#d1c8b4;}
.save-mask{position:fixed;inset:0;background:rgba(20,14,8,0.45);display:none;
  align-items:center;justify-content:center;z-index:100;padding:12px;}
.save-mask.show{display:flex;}
.save-box{width:100%;max-width:400px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-radius);padding:20px;}
.save-title{text-align:center;font-size:19px;letter-spacing:3px;margin-bottom:16px;color:var(--ink-main);}
.slot-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--opt-border);
  border-radius:var(--opt-radius);padding:12px 14px;margin-bottom:10px;background:var(--opt-bg);}
.slot-info{font-size:14px;}
.slot-empty{color:#999;}
.slot-buttons{display:flex;gap:6px;}
.slot-btn{padding:4px 8px;border:1px solid var(--opt-border);background:#fffaf0;border-radius:6px;
  font-family:inherit;cursor:pointer;font-size:13px;}
.slot-btn:hover{border-color:var(--cinnabar);}
.slot-btn.del{color:#b9412c;}
.save-close-wrap{text-align:center;margin-top:14px;}
.home-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding-top:60px;padding-left:12px;padding-right:12px;}
.home-title{font-size:46px;letter-spacing:10px;margin-bottom:10px;color:var(--ink-main);}
.home-sub{font-size:14px;letter-spacing:3px;color:var(--ink-soft);margin-bottom:30px;}
.home-panel{width:100%;max-width:400px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-radius);padding:24px 20px;text-align:center;}
.origin-choice-wrap{display:flex;gap:10px;margin-bottom:20px;}
.origin-item{flex:1;padding:14px 8px;border:1px solid var(--opt-border);border-radius:var(--opt-radius);
  background:var(--opt-bg);cursor:pointer;transition:0.2s;font-size:14px;}
.origin-item.active{border-color:var(--cinnabar);background:#fff3ec;}
.name-input{width:100%;padding:11px 14px;font-size:16px;border:1px solid var(--opt-border);
  border-radius:var(--opt-radius);background:var(--opt-bg);color:var(--ink-main);
  font-family:inherit;outline:none;margin-bottom:18px;}
.name-input:focus{border-color:var(--cinnabar);}
.main-btn{padding:11px 28px;background:var(--opt-bg);border:1px solid var(--opt-border);
  border-radius:var(--opt-radius);font-size:16px;letter-spacing:3px;font-family:inherit;
  cursor:pointer;transition:0.2s;color:var(--ink-main);}
.main-btn:disabled{opacity:0.45;cursor:not-allowed;}
.main-btn:hover:not(:disabled){border-color:var(--cinnabar);}
.prologue-mask{position:fixed;inset:0;background:rgba(20,14,8,0.45);display:none;
  align-items:center;justify-content:center;z-index:99;padding:12px;}
.prologue-box{max-width:460px;width:100%;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-radius);padding:36px 32px;text-align:center;}
.prologue-text{font-size:15px;line-height:1.9;margin-bottom:24px;color:var(--ink-main);white-space:pre-line;}
.game-wrap{display:none;max-width:700px;margin:0 auto;padding-top:70px;padding-left:12px;
  padding-right:12px;padding-bottom:16px;}
.head-info{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px;
  margin-bottom:16px;border-bottom:1px dashed #c8b492;}
.player-info strong{font-size:17px;margin-right:6px;cursor:pointer;text-decoration:underline dotted;}
.player-info{font-size:14px;color:var(--ink-soft);letter-spacing:2px;}
.progress-tip{font-size:13px;color:var(--ink-soft);letter-spacing:2px;}
.doc-panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--card-radius);
  padding:var(--card-padding-y) var(--card-padding-x);}
.case-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
.case-mark{background:var(--cinnabar);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;
  letter-spacing:2px;flex-shrink:0;}
.case-title{font-size:20px;letter-spacing:4px;color:var(--ink-main);}
.case-text{font-size:15px;padding:12px 14px;background:rgba(255,255,255,0.45);
  border-left:3px solid #947853;border-radius:8px;margin-bottom:18px;line-height:1.65;}
.opt-list{display:flex;flex-direction:column;gap:11px;}
.opt-item{background:var(--opt-bg);border:1px solid var(--opt-border);border-radius:var(--opt-radius);
  padding:13px 15px;font-size:15px;cursor:pointer;transition:0.2s;position:relative;padding-left:28px;}
.opt-item.disabled-opt{opacity:0.45;cursor:not-allowed;transform:none !important;}
.opt-item::before{content:"";position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;background:#b8a280;}
.opt-item:hover:not(.disabled-opt){border-color:var(--cinnabar);transform:translateX(3px);}
.opt-item:hover:not(.disabled-opt)::before{background:var(--cinnabar);}
.result-block{display:none;margin-top:18px;background:var(--opt-bg);border:1px solid var(--opt-border);
  border-radius:var(--opt-radius);padding:16px;}
.result-story{font-size:15px;margin-bottom:12px;line-height:1.65;}
.delta-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.tag-item.plus{border:1px solid #288c40;color:#288c40;padding:4px 9px;border-radius:18px;
  font-size:13px;letter-spacing:1px;}
.tag-item.minus{border:1px solid #b9412c;color:#b9412c;padding:4px 9px;border-radius:18px;
  font-size:13px;letter-spacing:1px;}
.result-foot{text-align:right;}
.modal-mask{position:fixed;inset:0;background:rgba(35,24,14,0.42);display:none;
  align-items:center;justify-content:center;z-index:99;padding:12px;}
.modal-mask.show{display:flex;}
.modal-content{width:100%;max-width:420px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-radius);padding:24px 20px;text-align:center;}
.modal-top-line{font-weight:bold;color:var(--cinnabar);margin-bottom:8px;font-size:14px;}
.modal-title{font-size:21px;letter-spacing:5px;color:var(--cinnabar);margin-bottom:12px;}
.modal-body{font-size:15px;margin-bottom:18px;line-height:1.75;white-space:pre-line;text-align:left;}
.career-mask{position:fixed;inset:0;background:rgba(20,14,8,0.45);display:none;
  align-items:center;justify-content:center;z-index:102;padding:12px;}
.career-mask.show{display:flex;}
.career-box{width:100%;max-width:400px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-radius);padding:20px;text-align:left;}
.career-title{text-align:center;font-size:19px;letter-spacing:3px;margin-bottom:14px;}
.career-row{margin:7px 0;font-size:14px;}
.career-close-wrap{text-align:center;margin-top:16px;}
.book-mask{position:fixed;inset:0;background:rgba(20,14,8,0.45);display:none;
  align-items:center;justify-content:center;z-index:101;padding:12px;}
.book-mask.show{display:flex;}
.book-box{width:100%;max-width:400px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-radius);padding:20px;}
.book-title{text-align:center;font-size:19px;letter-spacing:3px;margin-bottom:14px;}
.book-item{padding:8px 0;border-bottom:1px solid #e2d6c2;text-align:left;font-size:14px;}
.book-item.locked{color:#999;}
@media(max-width:600px){
  .home-title{font-size:38px;letter-spacing:8px;}
  .origin-choice-wrap{flex-direction:column;}
  .status-box{gap:12px;}
  .bottom-bar{gap:8px;padding:0 10px;}
  .bottom-btn{min-width:75px;padding:6px 6px;font-size:13px;}
  .prologue-box{padding:28px 22px;}
}
</style>
</head>
<body>
<div class="top-beam">
  <div class="help-btn" id="helpBtn">?</div>
  <div class="status-box" id="statusBox">
    <div class="status-item"><span class="status-lab">银钱</span><span class="status-val" id="money">5 两</span></div>
    <div class="status-item"><span class="status-lab">体力</span><span class="status-val" id="stamina">8 / 10</span></div>
  </div>
</div>
<div class="career-mask" id="careerMask">
  <div class="career-box">
    <div class="career-title">任职详情</div>
    <div class="career-row"><strong>所属机构：</strong><span id="caDept"></span></div>
    <div class="career-row"><strong>所属地：</strong><span id="caLoc"></span></div>
    <div class="career-row"><strong>岗位简述：</strong><span id="caDesc"></span></div>
    <div class="career-row"><strong>前职：</strong><span id="caPrev"></span></div>
    <div class="career-close-wrap"><button class="main-btn" id="closeCareerBtn">关闭</button></div>
  </div>
</div>
<div class="bottom-bar">
  <button class="bottom-btn" id="saveOpenBtn">存档</button>
  <button class="bottom-btn" id="loadOpenBtn">读档</button>
  <button class="bottom-btn" id="bookOpenBtn">结局图鉴</button>
</div>
<div class="save-mask" id="saveMask">
  <div class="save-box">
    <div class="save-title" id="saveModalTitle">存档档位</div>
    <div id="slotList"></div>
    <div class="save-close-wrap"><button class="main-btn" id="closeSaveBtn">关闭</button></div>
  </div>
</div>
<div class="book-mask" id="bookMask">
  <div class="book-box">
    <div class="book-title">结局图鉴</div>
    <div id="bookList"></div>
    <div style="text-align:center;margin-top:14px"><button class="main-btn" id="closeBookBtn">关闭</button></div>
  </div>
</div>
<div class="home-wrap" id="home">
  <h1 class="home-title">升官模拟器</h1>
  <div class="home-sub">—— 两条出身，各自抉择 ——</div>
  <div class="home-panel">
    <div class="origin-choice-wrap">
      <div class="origin-item" data-origin="poor">寒门｜科举入仕</div>
      <div class="origin-item" data-origin="noble">世荫｜恩荫入仕</div>
    </div>
    <input class="name-input" id="playerName" placeholder="请输入你的名字" maxlength="12">
    <br>
    <button class="main-btn" id="startBtn" disabled>开启官途</button>
  </div>
</div>
<div class="prologue-mask" id="prologueMask">
  <div class="prologue-box">
    <div class="prologue-text" id="prologueText"></div>
    <button class="main-btn" id="prologueConfirm">确认</button>
  </div>
</div>
<div class="game-wrap" id="game">
  <div class="head-info">
    <div class="player-info"><strong id="nameTag">无名</strong> <span id="rankTag">从九品署理主事</span></div>
    <div class="progress-tip" id="progressText"></div>
  </div>
  <div class="doc-panel">
    <div class="case-header">
      <span class="case-mark" id="caseMark">公务一</span>
      <div class="case-title" id="caseTitle"></div>
    </div>
    <div class="case-text" id="caseDesc"></div>
    <div class="opt-list" id="optList"></div>
    <div class="result-block" id="resultBlock">
      <div class="result-story" id="resStory"></div>
      <div class="delta-tags" id="tagWrap"></div>
      <div class="result-foot"><button class="main-btn" id="nextEv">继续</button></div>
    </div>
  </div>
</div>
<div class="modal-mask" id="modal">
  <div class="modal-content">
    <div class="modal-top-line" id="modalCareerTop"></div>
    <div class="modal-title" id="modTitle">提示</div>
    <div class="modal-body" id="modBody"></div>
    <button class="main-btn" id="modClose">进入下一篇章</button>
  </div>
</div>

startBtn.onclick=()=>{const n=playerNameInput.value.trim()||"无名";state.name=n;prologueTextEl.textContent=PROLOGUE_TEXT[state.origin];prologueMask.style.display="flex";};
prologueConfirm.onclick=()=>{if(state.origin==="noble"){prologueMask.style.display="none";return;}prologueMask.style.display="none";home.style.display="none";game.style.display="block";statusBox.style.display="flex";nameTag.textContent=state.name;rankTag.textContent=state.careerHigh;refreshStatus();renderEvent(events[0],"");updateSaveButtonState();};
modClose.onclick=()=>{modal.classList.remove("show");updateSaveButtonState();if(isRealEnding){resetGame();}else{
  if(pendingPromotion==="rank9Zheng"){state.rank9Zheng=true;state.zhengIndex=0;state.zhengSelected=[];state.zhengFlags=[];state.careerHigh="正九品 营构丞";rankTag.textContent=state.careerHigh;renderEvent(eventsRank9Zheng[0],"");}
  else if(pendingPromotion==="rank8Cong"){state.rank9Zheng=false;state.rank8Cong=true;state.rank8Index=0;state.rank8Selected=[];state.rank8Flags=[];state.careerHigh="从八品 左校署令";rankTag.textContent=state.careerHigh;renderEvent(eventsRank8Cong[0],"");}
  else if(pendingPromotion==="rank8Zheng"){state.rank8Cong=false;state.rank8Zheng=true;state.zheng8Index=0;state.zheng8Selected=[];state.zheng8Flags=[];state.hasFormerSuperiorEvent=false;state.careerHigh="正八品 武库署丞";rankTag.textContent=state.careerHigh;renderEvent(eventsRank8Zheng[0],"");}

}pendingPromotion=null;isRealEnding=false;};
function refreshStatus(){moneyEl.textContent=state.money+" 两";staminaEl.textContent=state.stamina+" / 10";}
function renderEvent(ev,tip){optList.innerHTML="";resultBlock.style.display="none";optList.style.display="flex";state.atResultPage=false;caseMark.textContent=ev.mark;caseTitle.textContent=ev.title;caseDesc.innerText=ev.desc;progressText.textContent=tip||"";ev.options.forEach((opt,i)=>{const div=document.createElement("div");div.className="opt-item";let labelText=opt.label;if(opt.isRandom){labelText+="（概率结局）";}div.textContent=labelText;let costMoney=opt.money??opt.moneyOk??0;if(costMoney<0&&(state.money+costMoney)<0){div.classList.add("disabled-opt");}else{div.onclick=()=>selectOpt(ev,i);}optList.appendChild(div);});updateSaveButtonState();}
function makeAttrTags(opt){
  const tags=[];
  const m=opt.money??opt.moneyOk;
  const s=opt.stamina??opt.staminaOk;
  const ta=opt.tact??opt.tactOk??0;
  const lo=opt.loyal??opt.loyalOk??0;
  const tal=opt.talent??opt.talentOk??0;
  const cr=opt.corrupt??opt.corruptOk??0;
  if(m!==undefined&&m!==0){tags.push({text:"银钱 "+(m>0?"+":"")+m,isPlus:m>0});}
  if(s!==undefined&&s!==0){tags.push({text:"体力 "+(s>0?"+":"")+s,isPlus:s>0});}
  if(cr!==0){tags.push({text:"贪腐 +"+cr,isPlus:true});}
  if(ta!==0){tags.push({text:"圆滑 +"+ta,isPlus:true});}
  if(lo!==0){tags.push({text:"忠直 +"+lo,isPlus:true});}
  if(tal!==0){tags.push({text:"才干 +"+tal,isPlus:true});}
  return tags;
}
function applyCorruptOnce(opt){
  const cr=opt.corrupt??opt.corruptOk??0;
  if(cr>0){
    state.corrupt += state.tact + cr;
    state.tact = 0;
    return true;
  }
  return false;
}
function selectOpt(ev,idx){const opt=ev.options[idx];if(opt.triggerEnd){showEnding(opt.triggerEnd);return;}if(opt.isRandom){const r=Math.random();const threshold=opt.prob??0.7;
  if(opt.resultFail==="GREED_FAIL"){if(r>=threshold){showEnding("greedFail");return;}else{state.money+=opt.moneyOk;state.stamina+=opt.staminaOk;state.loyal+=opt.loyalOk||0;state.talent+=opt.talentOk||0;const triggered=applyCorruptOnce(opt);if(opt.flagKey){if(state.rank9Zheng)state.zhengFlags.push(opt.flagKey);if(state.rank8Cong)state.rank8Flags.push(opt.flagKey);if(state.rank8Zheng)state.zheng8Flags.push(opt.flagKey);}refreshStatus();if(state.stamina<=0){showEnding("overworkDead");return;}resStory.textContent=opt.resultOk;tagWrap.innerHTML="";const arr=makeAttrTags(opt);if(triggered){arr.push({text:"此前“圆滑”全部转为“贪腐”",isPlus:true});}arr.forEach(item=>{const sp=document.createElement("span");sp.className="tag-item "+(item.isPlus?"plus":"minus");sp.textContent=item.text;tagWrap.appendChild(sp);});optList.style.display="none";resultBlock.style.display="block";state.atResultPage=true;updateSaveButtonState();return;}}
  if(opt.resultFail==="BEAM_DEAD"){if(r>=threshold){showEnding("beamDead");return;}else{state.money+=opt.moneyOk;state.stamina+=opt.staminaOk;state.tact+=opt.tactOk;state.loyal+=opt.loyalOk||0;state.talent+=opt.talentOk||0;refreshStatus();if(state.stamina<=0){showEnding("overworkDead");return;}resStory.textContent=opt.resultOk;tagWrap.innerHTML="";const arr=makeAttrTags(opt);arr.forEach(item=>{const sp=document.createElement("span");sp.className="tag-item "+(item.isPlus?"plus":"minus");sp.textContent=item.text;tagWrap.appendChild(sp);});optList.style.display="none";resultBlock.style.display="block";state.atResultPage=true;updateSaveButtonState();return;}}
  if(opt.resultFail==="FAIL_TRUST"){if(r>=threshold){showEnding("trustFail");return;}else{state.money+=opt.moneyOk;state.stamina+=opt.staminaOk;state.tact+=opt.tactOk;state.loyal+=opt.loyalOk||0;state.talent+=opt.talentOk||0;refreshStatus();if(state.stamina<=0){showEnding("overworkDead");return;}resStory.textContent=opt.resultOk;tagWrap.innerHTML="";const arr=makeAttrTags(opt);arr.forEach(item=>{const sp=document.createElement("span");sp.className="tag-item "+(item.isPlus?"plus":"minus");sp.textContent=item.text;tagWrap.appendChild(sp);});optList.style.display="none";resultBlock.style.display="block";state.atResultPage=true;updateSaveButtonState();return;}}}
  if(state.rank9Zheng){state.zhengSelected[state.zhengIndex]=idx;if(opt.flagKey)state.zhengFlags.push(opt.flagKey);}
  else if(state.rank8Cong){state.rank8Selected[state.rank8Index]=idx;if(opt.flagKey)state.rank8Flags.push(opt.flagKey);}
  else if(state.rank8Zheng){state.zheng8Selected[state.zheng8Index]=idx;if(opt.flagKey)state.zheng8Flags.push(opt.flagKey);}
  else{state.selected[state.index]=idx;if(opt.flagKey)state.flags[opt.flagKey]=true;}
  state.money+=opt.money??0;state.stamina+=opt.stamina??0;state.tact+=opt.tact??0;state.loyal+=opt.loyal??0;state.talent+=opt.talent??0;
  const triggered=applyCorruptOnce(opt);
  refreshStatus();if(state.stamina<=0){showEnding("overworkDead");return;}
  resStory.textContent=opt.result;tagWrap.innerHTML="";const arr=makeAttrTags(opt);if(triggered){arr.push({text:"此前“圆滑”全部转为“贪腐”",isPlus:true});}arr.forEach(item=>{const sp=document.createElement("span");sp.className="tag-item "+(item.isPlus?"plus":"minus");sp.textContent=item.text;tagWrap.appendChild(sp);});optList.style.display="none";resultBlock.style.display="block";state.atResultPage=true;updateSaveButtonState();}
nextEv.onclick=()=>{state.atResultPage=false;optList.style.display="flex";
  if(state.rank9Zheng){if(state.zhengIndex===0&&!state.hasRestTeamEvent){const roll=Math.random();if(roll<0.4){state.hasRestTeamEvent=true;renderEvent(restTeamEvent,"特殊事件 · 休沐团建");return;}}state.zhengIndex++;if(state.zhengIndex>=eventsRank9Zheng.length){let badCount=0;const badKeys=["zhengB","zhengD","zhengE","zhengG","zhengH"];badKeys.forEach(k=>{if(state.zhengFlags.includes(k))badCount++;});if(badCount>=2){showEnding("dismiss");}else{isRealEnding=false;pendingPromotion="rank8Cong";modClose.textContent="即刻到任";state.stamina=10;state.money+=18;refreshStatus();modalCareerTop.textContent="";modTitle.textContent="考绩上等，准予升迁";modBody.textContent="考绩上等，准予升迁。体力回满至 10，银两+18，进入从八品篇章。";modal.classList.add("show");updateSaveButtonState();}return;}renderEvent(eventsRank9Zheng[state.zhengIndex],"");}
  else if(state.rank8Cong){state.rank8Index++;if(state.rank8Index>=eventsRank8Cong.length){const bad8Set=new Set(["rank8A","rank8B","rank8D","rank8E"]);let bad8Count=0;for(const f of state.rank8Flags){if(bad8Set.has(f))bad8Count++;}if(bad8Count>=2){showEnding("dismiss");}else{isRealEnding=false;pendingPromotion="rank8Zheng";modClose.textContent="即刻到任";state.stamina=10;state.money+=28;refreshStatus();modalCareerTop.textContent="";modTitle.textContent="考绩上等，准予升迁";modBody.textContent="考绩上等，准予升迁。体力回满至 10，银两+28，进入正八品篇章。";modal.classList.add("show");updateSaveButtonState();}return;}renderEvent(eventsRank8Cong[state.rank8Index],"");}
  else if(state.rank8Zheng){if(state.zheng8Index===0&&!state.hasFormerSuperiorEvent){const roll=Math.random();if(roll<0.5){state.hasFormerSuperiorEvent=true;renderEvent(formerSuperiorEvent,"特殊事件 · 前上官有喜");return;}}state.zheng8Index++;if(state.zheng8Index>=eventsRank8Zheng.length){const bad8ZhengSet=new Set(["zheng8A","zheng8B","zheng8D"]);let bad8ZhengCount=0;for(const f of state.zheng8Flags){if(bad8ZhengSet.has(f))bad8ZhengCount++;}if(bad8ZhengCount>=2){showEnding("dismiss");}else{isRealEnding=false;pendingPromotion="rank7";modClose.textContent="即刻到任";state.stamina=10;state.money+=18;refreshStatus();modalCareerTop.textContent="";modTitle.textContent="考绩上等，准予升迁";modBody.textContent="考绩上等，准予升迁。体力回满至 10，银两+18，进入从七品篇章。";modal.classList.add("show");updateSaveButtonState();}return;}renderEvent(eventsRank8Zheng[state.zheng8Index],"");}
  else{if(state.index>=2){if(!state.hasBirthEvent&&Math.random()<0.4){state.hasBirthEvent=true;renderEvent(birthEvent,"随机事件 · 上官生辰");return;}else{calcFinalJudge();return;}}state.index++;renderEvent(events[state.index],"");}};
function calcFinalJudge(){const f=state.flags;let bad=0;if(f.task1B)bad++;if(f.task2A)bad++;if(f.task2B)bad++;if(f.task3B)bad++;if(bad>=2){showEnding("dismiss");}else{isRealEnding=false;pendingPromotion="rank9Zheng";modClose.textContent="即刻到任";state.stamina=10;state.money+=8;refreshStatus();modalCareerTop.textContent="";modTitle.textContent="考绩上等，准予升迁";modBody.textContent="考绩上等，准予升迁。体力恢复至 10，发放从九品年俸八两，进入正九品篇章。";modal.classList.add("show");updateSaveButtonState();}}
function resetGame(){state.name="无名";state.origin=null;state.money=5;state.stamina=8;state.tact=0;state.corrupt=0;state.loyal=0;state.talent=0;state.index=0;state.selected=[null,null,null];state.flags={task1B:false,task2A:false,task2B:false,task3B:false};state.careerHigh="从九品署理主事";state.hasBirthEvent=false;state.hasRestTeamEvent=false;state.atResultPage=false;state.rank9Zheng=false;state.zhengIndex=0;state.zhengSelected=[];state.zhengFlags=[];state.rank8Cong=false;state.rank8Index=0;state.rank8Selected=[];state.rank8Flags=[];state.rank8Zheng=false;state.zheng8Index=0;state.zheng8Selected=[];state.zheng8Flags=[];state.hasFormerSuperiorEvent=false;home.style.display="flex";game.style.display="none";statusBox.style.display="none";playerNameInput.value="";originItems.forEach(x=>x.classList.remove("active"));startBtn.disabled=true;updateSaveButtonState();}
function getAllSave(){const raw=localStorage.getItem(SAVE_KEY);if(!raw)return[null,null,null];try{return JSON.parse(raw);}catch(e){return[null,null,null];}}
function saveAllSave(slots){localStorage.setItem(SAVE_KEY,JSON.stringify(slots));}
function renderSaveSlots(){const slots=getAllSave();slotListWrap.innerHTML="";for(let i=0;i<3;i++){const slotData=slots[i];const div=document.createElement("div");div.className="slot-item";const infoWrap=document.createElement("div");infoWrap.className="slot-info";if(slotData){const saveTime=new Date(slotData.saveTime).toLocaleString();let rankTip;if(slotData.rank8Zheng)rankTip="正八品";else if(slotData.rank8Cong)rankTip="从八品";else if(slotData.rank9Zheng)rankTip="正九品";else rankTip="从九品";let pageHint=slotData.atResultPage?"【结果页】":"【选项页】";infoWrap.innerText=`存档${i+1}｜${slotData.name}｜${rankTip} ${pageHint}｜${saveTime}`;}else{infoWrap.innerText=`存档${i+1}`;infoWrap.classList.add("slot-empty");}const btnWrap=document.createElement("div");btnWrap.className="slot-buttons";if(window.saveMode==="save"){const saveBtn=document.createElement("button");saveBtn.className="slot-btn";saveBtn.innerText="保存";saveBtn.onclick=()=>writeSave(i);btnWrap.appendChild(saveBtn);}else{if(slotData){const loadBtn=document.createElement("button");loadBtn.className="slot-btn";loadBtn.innerText="读取";loadBtn.onclick=()=>loadSave(i);btnWrap.appendChild(loadBtn);}}if(slotData){const delBtn=document.createElement("button");delBtn.className="slot-btn del";delBtn.innerText="删除";delBtn.onclick=()=>delSave(i);btnWrap.appendChild(delBtn);}div.appendChild(infoWrap);div.appendChild(btnWrap);slotListWrap.appendChild(div);}}
function writeSave(slotIndex){const slots=getAllSave();let progressLabel="";if(state.rank8Zheng){progressLabel=`正八品公务${state.zheng8Index+1}`;}else if(state.rank8Cong){progressLabel=`从八品公务${state.rank8Index+1}`;}else if(state.rank9Zheng){progressLabel=`正九品公务${state.zhengIndex+1}`;}else if(state.hasBirthEvent){progressLabel="上官生辰事件";}else if(state.hasRestTeamEvent){progressLabel="休沐团建事件";}else{progressLabel=`公务${state.index+1}`;}slots[slotIndex]={...JSON.parse(JSON.stringify(state)),saveTime:new Date().toISOString(),progress:progressLabel};saveAllSave(slots);renderSaveSlots();alert(`成功存入存档${slotIndex+1}`);}
function loadSave(slotIndex){const slots=getAllSave();const data=slots[slotIndex];if(!data)return;Object.assign(state,data);nameTag.textContent=state.name;rankTag.textContent=state.careerHigh;refreshStatus();home.style.display="none";game.style.display="block";statusBox.style.display="flex";saveMask.classList.remove("show");
  if(state.rank8Zheng){if(state.hasFormerSuperiorEvent){renderEvent(formerSuperiorEvent,"特殊事件 · 前上官有喜");}else{renderEvent(eventsRank8Zheng[state.zheng8Index],"");}}
  else if(state.rank8Cong){renderEvent(eventsRank8Cong[state.rank8Index],"");}
  else if(state.rank9Zheng){if(state.hasRestTeamEvent){renderEvent(restTeamEvent,"特殊事件 · 休沐团建");}else{renderEvent(eventsRank9Zheng[state.zhengIndex],"");}}
  else{if(state.hasBirthEvent){renderEvent(birthEvent,"随机事件 · 上官生辰");}else{renderEvent(events[state.index],"");}}
  if(state.atResultPage){optList.style.display="none";resultBlock.style.display="block";resStory.textContent="";tagWrap.innerHTML="";}updateSaveButtonState();}
function delSave(slotIndex){const slots=getAllSave();slots[slotIndex]=null;saveAllSave(slots);renderSaveSlots();alert(`已删除存档${slotIndex+1}`);}
// ===== 隐藏调试面板：连点银钱3下呼出 =====
let moneyTapCount=0;let moneyTapTimer=null;
moneyEl.style.cursor="default";moneyEl.style.userSelect="none";
moneyEl.addEventListener("click",()=>{
  moneyTapCount++;
  clearTimeout(moneyTapTimer);
  if(moneyTapCount>=3){moneyTapCount=0;showHiddenAttrPanel();return;}
  moneyTapTimer=setTimeout(()=>{moneyTapCount=0;},800);
});
function showHiddenAttrPanel(){
  const talentVal=state.talent;const corruptVal=state.corrupt;
  const loyalVal=state.loyal;const tactVal=state.tact;
  const panel=document.createElement("div");
  panel.style=`position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:12px;`;
  panel.innerHTML=`
    <div style="background:#fbf5e8;padding:24px;border-radius:14px;min-width:280px;max-width:340px;border:1px solid #c8b492;">
      <h3 style="text-align:center;margin-bottom:18px;color:#b9412c;letter-spacing:2px;">策划调试｜隐藏属性</h3>
      <p style="font-size:16px;margin:10px 0;">才干：${talentVal}</p>
      <p style="font-size:16px;margin:10px 0;">圆滑：${tactVal}</p>
      <p style="font-size:16px;margin:10px 0;">贪腐：${corruptVal}</p>
      <p style="font-size:16px;margin:10px 0;">忠直：${loyalVal}</p>
      <div style="margin-top:20px;text-align:center;">
        <button id="closeAttrPanel" class="main-btn">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(panel);
  document.getElementById("closeAttrPanel").onclick=()=>{panel.remove();};
  panel.onclick=(e)=>{if(e.target===panel){panel.remove();}};
  function escHandler(ev){if(ev.key==="Escape"){panel.remove();document.removeEventListener("keydown",escHandler);}}
  document.addEventListener("keydown",escHandler);
}
